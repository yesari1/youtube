<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/fonts.css"><link rel="stylesheet" href="../kit/kit.css">
<style>
.col{position:absolute;bottom:240px;border-radius:4px 4px 0 0;overflow:hidden;}
.cl1{font:600 34px/1 'Barlow Condensed';letter-spacing:.03em;text-align:center;}
.cl2{font:700 54px/1 'Barlow Condensed';text-align:center;font-variant-numeric:tabular-nums;}
.mag{position:absolute;width:150px;height:31px;margin-left:-75px;border-radius:3px;background:linear-gradient(180deg,#a3ad86,#6f7a57);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 0 10px rgba(163,173,134,.15);}
.pk{position:absolute;width:146px;height:29px;margin-left:-75px;border-radius:3px;border:2px dashed #a3ad86;}
#svg{position:absolute;left:0;top:0;}
#fx{position:absolute;inset:0;pointer-events:none;}
</style></head><body>
<div id="frame"><div id="stage">
 <svg id="svg" width="1920" height="1080"></svg>
 <div class="t title" id="ti" style="left:426px;top:96px;font-size:84px"><span class="mask"><span>What the BAR Man Carried</span></span></div>
 <div id="ghost" style="position:absolute;left:620px;top:0;width:0;height:0"></div><div class="col" id="cA" style="left:520px;width:200px;background:linear-gradient(180deg,#3a3326,#262119);border:2px solid #c9a45a;border-bottom:none"></div><div id="barv" style="position:absolute;left:620px;top:${0}px;width:440px;height:88px;transform-origin:0 50%;transform:translate(0px,-14px) rotate(-90deg)"></div>
 <div class="col" id="cB" style="left:800px;width:200px;background:linear-gradient(180deg,#34312a,#24221d);border:2px solid #8f897a;border-bottom:none"></div>
 <div id="mags"></div>
 <div class="t cl1" id="lA1" style="left:620px;top:862px">BAR M1918A2, with sling</div>
 <div class="t cl2" id="lA2" style="left:620px;top:906px;color:var(--brassHi)">≈20 lb</div>
 <div class="t cl1" id="lB1" style="left:900px;top:862px">M1 rifle</div>
 <div class="t cl2" id="lB2" style="left:900px;top:906px">9.5 lb</div>
 <div class="t cl1" id="lC1" style="left:1260px;top:862px;color:var(--odHi)">Korea belt: 12 magazines</div>
 <div class="t cl2" id="lC2" style="left:1260px;top:906px;color:var(--odHi)">≈17 lb <span style="font:500 28px 'Barlow Condensed';color:var(--dim)">(calculated)</span></div>
 <div class="t lab" id="one1" style="left:1500px;top:600px;font-size:34px">1 loaded magazine</div>
 <div class="t cl2" id="one2" style="left:1500px;top:644px;text-align:left">1 lb 7 oz</div>
 <div class="t lab" id="pk" style="left:1360px;top:0px;font-size:36px;color:var(--odHi)">+3–4 in pockets</div>
 <div class="t foot" id="ft" style="left:152px;top:978px">BAR and magazine: FM 23-15 (1943); belt total calculated</div>
 <canvas id="fx" width="1920" height="1080"></canvas>
</div><div id="vig"></div></div>
<script src="../kit/kit.js"></script><script src="../kit/bar_svg.js"></script>
<script>
const CUE={bar:2.2,m1:4.6,one:6.1,belt:9.8,pk:13.8,ft:14.4};
const Y0=840,PXL=24; const hpx=lb=>lb*PXL; const yl=lb=>Y0-hpx(lb);
const MAG=1+7/16, CX=1260;
$('barv').innerHTML=barSVG({bipod:true,color:'#d8c9a0',wood:'#6b5236'});
const svg=$('svg');
svg.innerHTML=`<line x1="430" y1="${Y0}" x2="430" y2="${yl(25.5)}" stroke="#8f897a" stroke-width="3" id="axl"/>
<line x1="430" y1="${Y0}" x2="1460" y2="${Y0}" stroke="#8f897a" stroke-width="3" id="base"/>
${[0,5,10,15,20,25].map(v=>`<g class="tk"><line x1="414" y1="${yl(v)}" x2="430" y2="${yl(v)}" stroke="#8f897a" stroke-width="3"/><text x="402" y="${yl(v)+9}" fill="#8f897a" font-family="IBM Plex Mono" font-size="25" text-anchor="end">${v} lb</text>
<line x1="436" y1="${yl(v)}" x2="1460" y2="${yl(v)}" stroke="#4a463d" stroke-width="1" stroke-dasharray="2 10" opacity=".7"/></g>`).join('')}
<line id="ref" x1="520" y1="${yl(20)}" x2="1350" y2="${yl(20)}" stroke="#c9a45a" stroke-width="2" stroke-dasharray="8 8"/>
<path id="br" fill="none" stroke="#a3ad86" stroke-width="2.5"/>`;
const M=$('mags'),mags=[],pks=[];
for(let i=0;i<12;i++){const d=document.createElement('div');d.className='mag';M.appendChild(d);mags.push(d);}
for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pk';M.appendChild(d);pks.push(d);}
const fx=$('fx').getContext('2d');
['lA1','lA2','lB1','lB2','lC1','lC2'].forEach(id=>$(id).dataset.c=1);
function render(t){
 const a=ambient(t);
 const ped=lerp(26,-8,inOutSine(seg(t,0,13))); const z=lerp(1.0,1.03,inOutSine(seg(t,0,14)));
 $('stage').style.transform=`translate(${a.x}px,${a.y+ped}px) scale(${z})`;
 maskIn($('ti').firstChild.firstChild,outQuint(seg(t,-0.9,0.5)));
 document.querySelectorAll('.tk').forEach((g,i)=>g.style.opacity=0.5+0.5*outCubic(seg(t,i*0.12,0.6+i*0.12)));
 // BAR column rises like a gauge on "twenty pounds"
 const pa=outQuint(seg(t,CUE.bar,CUE.bar+1.3)); const cA=$('cA'); cA.style.height=(hpx(20)*pa+0.001)+'px'; cA.style.opacity=pa>0?1:0;
 const bv=$('barv'); bv.style.top=(Y0-44)+'px'; bv.style.opacity=0.3+0.7*outCubic(seg(t,CUE.bar+0.3,CUE.bar+1.2));
 const pb=outQuint(seg(t,CUE.m1,CUE.m1+1.1)); const cB=$('cB'); cB.style.height=(hpx(9.5)*pb+0.001)+'px'; cB.style.opacity=pb>0?1:0;
 const lab=(id,t0)=>{const e=$(id);reveal(e,outCubic(seg(t,t0,t0+0.7)),14);e.style.transform+=' translateX(-50%)';};
 lab('lA1',CUE.bar+0.3); lab('lA2',CUE.bar+0.9); lab('lB1',CUE.m1+0.2); lab('lB2',CUE.m1+0.7);
 $('ref').style.opacity=0.7*outCubic(seg(t,CUE.belt+0.4,CUE.belt+1.2))*(1-0.8*outCubic(seg(t,CUE.pk-0.2,CUE.pk+0.4)));
 // single magazine introduced on the right, then it becomes the first block of the belt
 const op=outBack(seg(t,CUE.one,CUE.one+0.7),1.3);
 reveal($('one1'),outCubic(seg(t,CUE.one+0.3,CUE.one+1.0)),0,-20); reveal($('one2'),outCubic(seg(t,CUE.one+0.8,CUE.one+1.5)),0,-20);
 const fadeOne=1-outCubic(seg(t,CUE.belt+2.6,CUE.belt+3.4)); $('one1').style.opacity*=fadeOne; $('one2').style.opacity*=fadeOne;
 let landed=0;
 mags.forEach((d,i)=>{let x,y,o=1,s=1;
  const tl=CUE.belt+0.3+i*0.17, u=seg(t,tl-0.45,tl), e=outCubic(u);
  const yt=yl(MAG*(i+1))+1;
  if(i===0){const v=inOutCubic(seg(t,CUE.belt,CUE.belt+0.75));
   x=lerp(1580,CX,v); y=lerp(560,yt,v)-Math.sin(Math.PI*v)*60; o=cl(op*3); s=lerp(1+0.2*(1-op),1,v); if(t>=CUE.belt+0.75) landed++;}
  else {x=CX; y=lerp(yt-260,yt,e); o=cl(u*3); if(t>=tl) landed++;}
  const bump=Math.exp(-((t-tl)**2)/0.004)*0.05;
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.opacity=o; d.style.transform=`scale(${s+bump},${s-bump})`;
  d.style.filter=`brightness(${1+0.04*Math.sin(t*1.2+i)})`;});
 lab('lC1',CUE.belt+0.2);
 const cnt=$('lC2'); const done=landed>=12;
 cnt.firstChild.textContent=done?'≈17 lb ':`${(landed*MAG).toFixed(1)} lb `; reveal(cnt,outCubic(seg(t,CUE.belt+0.4,CUE.belt+0.9)),10); cnt.style.transform+=' translateX(-50%)';
 cnt.lastChild.style.opacity=outCubic(seg(t,CUE.belt+2.5,CUE.belt+3.1));
 // pocket magazines: dashed outlines = uncertain 3–4
 pks.forEach((d,i)=>{const tl=CUE.pk+i*0.28;const u=outCubic(seg(t,tl,tl+0.5));
  d.style.left=CX+'px'; d.style.top=(yl(MAG*(13+i))+2-(1-u)*30)+'px'; d.style.opacity=u*(i===3?0.5:0.85)*(0.92+0.08*Math.sin(t*1.4+i));});
 const pe=$('pk'); reveal(pe,outCubic(seg(t,CUE.pk+0.5,CUE.pk+1.1)),0,-16); pe.style.top=(yl(MAG*14.5)-36)+'px';
 const bp=inOutCubic(seg(t,CUE.pk+0.3,CUE.pk+1.0)); const y1=yl(MAG*12)-2,y2=yl(MAG*16)+2;
 $('br').setAttribute('d',`M1342 ${y1} L1350 ${y1} L1350 ${lerp(y1,y2,bp)} L1342 ${lerp(y1,y2,bp)}`); $('br').style.opacity=bp;
 reveal($('ft'),outCubic(seg(t,CUE.ft,CUE.ft+0.8)),0);
 // light sweep up the brass edge of the BAR column once built, then dust
 fx.clearRect(0,0,1920,1080);
 const sv=seg(t,CUE.bar+1.4,CUE.bar+2.6);
 if(sv>0&&sv<1){const yy=lerp(Y0,yl(20),inOutSine(sv));const g=fx.createLinearGradient(0,yy-80,0,yy+80);
  g.addColorStop(0,'rgba(255,228,170,0)');g.addColorStop(.5,'rgba(255,228,170,.16)');g.addColorStop(1,'rgba(255,228,170,0)');fx.fillStyle=g;fx.fillRect(520,yy-80,204,160);}
 for(let i=0;i<24;i++){const px=(hn(i)*1920+t*(6+hn(i+40)*8))%1920, py=(hn(i+90)*1080-t*(5+hn(i+7)*4)+1080)%1080;
  fx.fillStyle=`rgba(236,229,211,${0.04+0.05*hn(i+3)})`;fx.beginPath();fx.arc(px,py,1.1+hn(i+5)*1.5,0,7);fx.fill();}
}
render(0);
</script></body></html>
