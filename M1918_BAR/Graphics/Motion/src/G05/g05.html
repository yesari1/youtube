<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/fonts.css"><link rel="stylesheet" href="../kit/kit.css">
<style>
.bar{position:absolute;width:250px;margin-left:-125px;bottom:200px;overflow:hidden;border-radius:2px 2px 0 0;
 background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 37px,rgba(0,0,0,.35) 37px 39px),linear-gradient(90deg,#5e6748,#7f8b66 40%,#6f7a57 70%,#535b40);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);}
.bar>div svg{width:220px;height:44px;}.bar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18));}
.big{position:absolute;font:700 76px/1 'Barlow Condensed';letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:center;}
.war{position:absolute;font:600 40px/1 'Barlow Condensed';letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.mk{position:absolute;font:500 26px/1.2 'Barlow Condensed';letter-spacing:.03em;color:var(--dim);text-align:center;width:360px;margin-left:-180px;white-space:normal;}
#svg{position:absolute;left:0;top:0;} #fx{position:absolute;inset:0;pointer-events:none;}
</style></head><body>
<div id="frame"><div id="stage">
 <svg id="svg" width="1920" height="1080"></svg>
 <div class="t title" id="ti" style="left:136px;top:96px;font-size:84px"><span class="mask"><span>Three Wars of Production</span></span></div>
 <div class="t expl" id="ex" style="left:140px;top:204px">New-built guns only; rebuilt and converted guns not included</div>
 <div id="bars"></div>
 <div class="t foot" id="ft" style="left:140px;top:258px">New manufacture only</div>
 <canvas id="fx" width="1920" height="1080"></canvas>
</div><div id="vig"></div></div>
<script src="../kit/kit.js"></script><script src="../kit/bar_svg.js"></script>
<script>
const CUE={b:[3.4,7.5,16.3],g:[1.6,1.6,0.95],ft:10.5};
const FLOOR=880,K=2.6/1000; const D=[
 {x:640,v:102174,war:'WWI (M1918)',mk:'Colt, Winchester, Marlin-Rockwell'},
 {x:1060,v:188380,war:'WWII (M1918A2)',mk:'New England Small Arms, IBM',hi:1},
 {x:1480,v:61000,war:'Korea (M1918A2)',mk:'Royal McBee'}];
const svg=$('svg');
svg.innerHTML=[0,50000,100000,150000,200000].map((v,i)=>`<g class="gl"><line x1="420" y1="${FLOOR-v*K}" x2="1700" y2="${FLOOR-v*K}" stroke="${i?'#3a352b':'#8f897a'}" stroke-width="${i?1.5:3}" ${i?'stroke-dasharray="3 9"':''}/>
<text x="404" y="${FLOOR-v*K+8}" fill="#8f897a" font-family="IBM Plex Mono" font-size="22" text-anchor="end">${v.toLocaleString('en-US')}</text></g>`).join('');
const B=$('bars');
D.forEach((d,i)=>{const b=document.createElement('div');b.className='bar';b.style.left=d.x+'px';B.appendChild(b);d.b=b;const ic=document.createElement('div');ic.style.cssText='position:absolute;left:15px;top:24px;width:220px;height:44px;opacity:.62';ic.innerHTML=barSVG({bipod:i>0,color:'#ece5d3',wood:'#ece5d3'});const sx=document.createElement('div');sx.style.cssText="position:absolute;left:0;right:0;top:84px;text-align:center;font:700 30px/1 'Barlow Condensed';letter-spacing:.22em;color:rgba(236,229,211,.5)";sx.textContent=['M1918','M1918A2','M1918A2'][i];b.appendChild(sx);b.appendChild(ic);
 const n=document.createElement('div');n.className='big t';n.style.color=d.hi?'#e8c983':'#ece5d3';B.appendChild(n);d.n=n;
 const w=document.createElement('div');w.className='war t';w.textContent=d.war;w.style.left=d.x+'px';w.style.top=(FLOOR+24)+'px';B.appendChild(w);d.w=w;
 const m=document.createElement('div');m.className='mk t';m.textContent=d.mk;m.style.left=d.x+'px';m.style.top=(FLOOR+76)+'px';B.appendChild(m);d.m=m;});
const fx=$('fx').getContext('2d');
function render(t){
 const a=ambient(t);
 // pedestal: camera rises with the tallest bar, then settles back
 const ped=Math.sin(Math.PI*seg(t,CUE.b[1]-0.3,CUE.b[1]+3.6))*-22*1+lerp(14,0,inOutSine(seg(t,0,4)));
 $('stage').style.transform=`translate(${a.x}px,${a.y-ped}px) scale(${lerp(1.0,1.025,inOutSine(seg(t,0,16)))})`;
 maskIn($('ti').firstChild.firstChild,outQuint(seg(t,-0.9,0.5)));
 reveal($('ex'),outCubic(seg(t,0.8,1.6)),14);
 document.querySelectorAll('.gl').forEach((g,i)=>g.style.opacity=0.5+0.5*outCubic(seg(t,i*0.15,0.8+i*0.15)));
 D.forEach((d,i)=>{const t0=CUE.b[i],gd=CUE.g[i]; const u=outQuint(seg(t,t0,t0+gd)); const h=d.v*K*u;
  d.b.style.height=(h+0.001)+'px'; d.b.style.opacity=t<t0?0:1;
  const cnt=Math.round(d.v*outCubic(seg(t,t0,t0+gd))); d.n.textContent=fmt(cnt);
  d.n.style.left=d.x+'px'; d.n.style.top=(FLOOR-h-92)+'px'; d.n.style.transform='translateX(-50%)'; d.n.style.opacity=outCubic(seg(t,t0,t0+0.4));
  const lp=0.6+0.4*outCubic(seg(t,t0-0.3,t0+0.4)); d.w.style.opacity=lp; d.w.style.transform='translateX(-50%)';
  d.m.style.opacity=outCubic(seg(t,t0+0.8,t0+1.5)); d.m.style.transform=`translateY(${(1-outCubic(seg(t,t0+0.8,t0+1.5)))*10}px)`;
  d.b.style.filter=`brightness(${1+0.03*Math.sin(t*1.1+i*2)})`;});
 reveal($('ft'),outCubic(seg(t,CUE.ft,CUE.ft+0.8)),0);
 fx.clearRect(0,0,1920,1080);
 // a stencil-spray glint travels up each bar as it finishes
 D.forEach((d,i)=>{const s=seg(t,CUE.b[i]+CUE.g[i]-0.4,CUE.b[i]+CUE.g[i]+0.6); if(s<=0||s>=1)return; const y=lerp(FLOOR,FLOOR-d.v*K,inOutSine(s));
  const g=fx.createLinearGradient(0,y-70,0,y+70);g.addColorStop(0,'rgba(255,236,190,0)');g.addColorStop(.5,'rgba(255,236,190,.14)');g.addColorStop(1,'rgba(255,236,190,0)');fx.fillStyle=g;fx.fillRect(d.x-125,y-70,250,140);});
 for(let i=0;i<24;i++){const px=(hn(i)*1920+t*(6+hn(i+40)*8))%1920, py=(hn(i+90)*1080-t*(4+hn(i+7)*4)+1080)%1080;
  fx.fillStyle=`rgba(236,229,211,${0.04+0.05*hn(i+3)})`;fx.beginPath();fx.arc(px,py,1.1+hn(i+5)*1.5,0,7);fx.fill();}
}
render(0);
</script></body></html>
