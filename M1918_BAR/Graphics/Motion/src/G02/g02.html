<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/fonts.css"><link rel="stylesheet" href="../kit/kit.css">
<style>
.f{position:absolute;width:70px;height:80px;margin:-42px 0 0 -35px;}
.hd{font:600 44px/1 'Barlow Condensed';letter-spacing:.03em;}
.cn{font:500 34px/1 'Barlow Condensed';letter-spacing:.04em;color:var(--dim);}
.sm{font:500 27px/1 'Barlow Condensed';letter-spacing:.03em;color:var(--dim);}
.lg{font:500 29px/1 'Barlow Condensed';letter-spacing:.03em;color:var(--ink);}
#lines{position:absolute;left:0;top:0;}
#fx{position:absolute;inset:0;pointer-events:none;}
</style></head><body>
<div id="frame"><div id="stage">
 <svg id="lines" width="1920" height="1080"></svg>
 <div class="t title" id="ti" style="left:960px;top:70px;font-size:80px;transform-origin:50% 0"><span class="mask"><span>Two Ways to Build a Squad</span></span></div>
 <div class="t hd" id="h1" style="left:470px;top:232px">U.S. Army rifle squad, 1944</div>
 <div class="t cn" id="c1" style="left:470px;top:290px"><span>12 men</span> · <span style="color:var(--brassHi)">1 BAR</span></div>
 <div class="t hd" id="h2" style="left:1450px;top:232px;color:var(--odHi)">U.S. Marine rifle squad, 1944</div>
 <div class="t cn" id="c2" style="left:1450px;top:290px"><span>13 men</span> · <span style="color:var(--brassHi)">3 BARs</span></div>
 <div class="t sm" id="a1" style="left:356px;top:418px;text-align:right">Squad leader</div>
 <div class="t sm" id="a2" style="left:584px;top:418px">Assistant squad leader</div>
 <div class="t sm" id="a3" style="left:520px;top:588px;color:var(--brassHi)">BAR team (3)</div>
 <div class="t sm" id="a4" style="left:470px;top:842px">Riflemen (7)</div>
 <div class="t sm" id="m1" style="left:1494px;top:400px">Squad leader</div>
 <div id="figs"></div>
 <div id="leg"></div>
 <div class="t foot" id="ft" style="left:960px;top:952px">Army: FM 7-10 (1944). Marines: T/O F-series (1944)</div>
 <canvas id="fx" width="1920" height="1080"></canvas>
</div><div id="vig"></div></div>
<script src="../kit/kit.js"></script><script src="../kit/fig.js"></script>
<script>
const CUE={title:0,army:1.3,abar:2.5,acount:3.8,mar:5.4,regroup:5.9,three:6.7,leg:[8.6,10.2,11.1,13.4],ft:14.0};
['ti','h1','c1','h2','c2','a4','ft'].forEach(id=>$(id).style.marginLeft='0');
const center=el=>{el.style.transform+=' translateX(-50%)';};
const F=$('figs'),figs=[];
function mk(x,y,kind){const d=document.createElement('div');d.className='f';
 const col=kind==='bar'?'#e8c983':(kind==='m'?'#a3ad86':'#ece5d3');d.innerHTML=figSVG(col,kind==='bar');F.appendChild(d);
 const o={d,x,y,kind};figs.push(o);return o;}
// Army: SL, ASL, BAR team (gunner highlighted), 7 riflemen
const army=[mk(400,430,'a'),mk(540,430,'a'),mk(330,600,'a'),mk(410,600,'bar'),mk(490,600,'a')];
for(let i=0;i<7;i++) army.push(mk(250+i*73.3,790,'a'));
// Marines: squad leader + 3 four-man fire teams (diamond: leader top, rifleman left, assistant right, BAR centre)
const TC=[1210,1450,1690],TY=650,OFF={tl:[0,-86],r:[-80,6],aar:[80,6],ar:[0,10]};
const mar=[mk(1450,430,'m')];mar[0].line=[1080,800];
const team=[];
TC.forEach((cx,k)=>['tl','r','aar','ar'].forEach(role=>{const o=mk(cx+OFF[role][0],TY+OFF[role][1],role==='ar'?'bar':'m');o.role=role;o.team=k;mar.push(o);team.push(o);}));
// starting formation: one straight line, like the Army layout
mar.forEach((o,i)=>{o.l=[1100+i*56,800];});
mar[0].l=[1450,430];
const roles=[['tl','Team leader (corporal)'],['r','Rifleman'],['aar','Assistant automatic rifleman'],['ar','Automatic rifleman (BAR)']];
const L=$('leg'),legs=[];
roles.forEach(([r,txt],i)=>{const x=1050+(i%2)*400,y=850+Math.floor(i/2)*58;const e=document.createElement('div');e.className='t';e.style.left=x+'px';e.style.top=(y-32)+'px';
 const dots=Object.entries(OFF).map(([k,v])=>`<circle cx="${34+v[0]*0.3}" cy="${36+v[1]*0.3}" r="${k===r?8:5.5}" fill="${k===r?(r==='ar'?'#e8c983':'#a3ad86'):'#4a463d'}"/>`).join('');
 e.innerHTML=`<svg width="70" height="64" style="vertical-align:middle;margin-right:10px">${dots}</svg><span class="lg">${txt}</span>`;L.appendChild(e);legs.push(e);});
const svg=$('lines');
svg.innerHTML=`<line id="div" x1="960" y1="230" x2="960" y2="960" stroke="#4a463d" stroke-width="2"/>`+
 team.filter(o=>o.role!=='ar').map((o,i)=>`<line class="ln" id="ln${i}" stroke="#a3ad86" stroke-width="3.5" stroke-linecap="round"/>`).join('')+
 `<circle id="ring" cx="410" cy="600" r="54" fill="none" stroke="#e8c983" stroke-width="2.5"/>`;
const fx=$('fx').getContext('2d');
function render(t){
 const a=ambient(t);
 const trk=lerp(26,-26,inOutSine(seg(t,0,12)));
 $('stage').style.transform=`translate(${a.x+trk}px,${a.y}px) scale(${lerp(1.02,1,inOutSine(seg(t,0,10)))})`;
 maskIn($('ti').firstChild.firstChild,outQuint(seg(t,-0.9,0.5))); $('ti').style.transform='translateX(-50%)';
 const hp=outCubic(seg(t,CUE.army-0.2,CUE.army+0.6)); reveal($('h1'),hp,18); center($('h1'));
 $('div').style.opacity=0.4+0.6*outCubic(seg(t,0,1.2));
 // Army figures: present faintly from frame one, brighten on "Army squad"
 army.forEach((o,i)=>{const ts=i<5?CUE.army+0.1+i*0.06:CUE.acount+(i-5)*0.07; const b=0.3+0.7*outCubic(seg(t,ts,ts+0.6));
  const isBar=o.kind==='bar'; const pop=isBar?outBack(seg(t,CUE.abar,CUE.abar+0.6),2):0;
  o.d.style.opacity=isBar?Math.max(b*0.7,0.3+0.7*seg(t,CUE.abar,CUE.abar+0.3)):b*(t>CUE.abar?lerp(1,0.62,seg(t,CUE.abar,CUE.abar+0.8)):1);
  o.d.style.transform=`translate(${o.x}px,${o.y}px) scale(${1.25+0.14*Math.sin(Math.PI*seg(t,CUE.abar,CUE.abar+0.6))*(isBar?1:0)})`;});
 const rp=seg(t,CUE.abar+0.1,CUE.abar+0.8); const ring=$('ring');
 ring.style.opacity=0.85*outCubic(rp); ring.setAttribute('r',lerp(100,62,outCubic(rp))+1.2*Math.sin(t*1.6));
 reveal($('a1'),outCubic(seg(t,CUE.army+0.5,CUE.army+1.1)),0,14); $('a1').style.transform+=' translateX(-100%)';
 reveal($('a2'),outCubic(seg(t,CUE.army+0.7,CUE.army+1.3)),0,-14);
 reveal($('a3'),outCubic(seg(t,CUE.abar+0.4,CUE.abar+1.0)),0,-14);
 reveal($('a4'),outCubic(seg(t,CUE.acount-0.2,CUE.acount+0.5)),10); center($('a4'));
 reveal($('c1'),outCubic(seg(t,CUE.acount,CUE.acount+0.7)),14); center($('c1'));
 // Marines
 reveal($('h2'),outCubic(seg(t,CUE.mar,CUE.mar+0.7)),18); center($('h2'));
 reveal($('m1'),outCubic(seg(t,CUE.mar+0.4,CUE.mar+1.0)),0,-14);
 mar.forEach((o,i)=>{const b=0.3+0.7*outCubic(seg(t,CUE.mar+0.1+i*0.04,CUE.mar+0.7+i*0.04));
  const order=o.team===undefined?0:(o.team*4+['tl','r','aar','ar'].indexOf(o.role));
  const u=inOutCubic(seg(t,CUE.regroup+order*0.06,CUE.regroup+1.1+order*0.06));
  const x=lerp(o.l[0],o.x,u), y=lerp(o.l[1],o.y,u)-Math.sin(Math.PI*u)*(o.team===undefined?0:46);
  let s=1.25; if(o.role){const li=['tl','r','aar','ar'].indexOf(o.role); s+=0.14*Math.sin(Math.PI*seg(t,CUE.leg[li],CUE.leg[li]+0.6));}
  o.d.style.opacity=b; o.d.style.transform=`translate(${x}px,${y}px) scale(${s})`;});
 reveal($('c2'),outCubic(seg(t,CUE.three,CUE.three+0.6)),14); center($('c2'));
 // links draw to each BAR man once teams have formed
 team.filter(o=>o.role!=='ar').forEach((o,i)=>{const arm=team.find(q=>q.team===o.team&&q.role==='ar');
  const p=inOutCubic(seg(t,CUE.regroup+1.4+i*0.07,CUE.regroup+2.1+i*0.07)); const l=$('ln'+i);
  const x0=arm.x,y0=arm.y-6,x1=o.x,y1=o.y-6, k=0.3;
  const sx=lerp(x0,x1,k),sy=lerp(y0,y1,k);
  l.setAttribute('x1',sx);l.setAttribute('y1',sy);l.setAttribute('x2',lerp(sx,lerp(x0,x1,0.72),p));l.setAttribute('y2',lerp(sy,lerp(y0,y1,0.72),p));
  l.style.opacity=0.75*p;});
 legs.forEach((e,i)=>reveal(e,outCubic(seg(t,CUE.leg[i],CUE.leg[i]+0.7)),0,-18));
 reveal($('ft'),outCubic(seg(t,CUE.ft,CUE.ft+0.8)),0); center($('ft'));
 // warm glow pulses under the three BAR men after the regroup, then breathes
 fx.clearRect(0,0,1920,1080);
 const gp=seg(t,CUE.regroup+1.0,CUE.regroup+2.2);
 team.filter(o=>o.role==='ar').forEach((o,k)=>{if(t>CUE.leg[3]+0.6){const ph=((t-CUE.leg[3]-0.6)*0.35+k*0.33)%1;fx.strokeStyle=`rgba(232,201,131,${0.28*(1-ph)})`;fx.lineWidth=2.5;fx.beginPath();fx.arc(o.x,o.y,40+ph*60,0,7);fx.stroke();}const r=80+6*Math.sin(t*1.2+k);const g=fx.createRadialGradient(o.x,o.y,0,o.x,o.y,r);
  const al=0.18*outCubic(gp)+0.03*Math.sin(t*1.5+k*2);g.addColorStop(0,`rgba(232,201,131,${al})`);g.addColorStop(1,'rgba(232,201,131,0)');fx.fillStyle=g;fx.fillRect(o.x-r,o.y-r,2*r,2*r);});
 {const o=army[3];const r=80;const g=fx.createRadialGradient(o.x,o.y,0,o.x,o.y,r);g.addColorStop(0,`rgba(232,201,131,${0.16*outCubic(seg(t,CUE.abar,CUE.abar+0.8))})`);g.addColorStop(1,'rgba(232,201,131,0)');fx.fillStyle=g;fx.fillRect(o.x-r,o.y-r,2*r,2*r);}
 for(let i=0;i<22;i++){const px=(hn(i)*1920+t*(7+hn(i+40)*9))%1920, py=(hn(i+90)*1080-t*(4+hn(i+7)*4)+1080)%1080;
  fx.fillStyle=`rgba(236,229,211,${0.04+0.05*hn(i+3)})`;fx.beginPath();fx.arc(px,py,1.1+hn(i+5)*1.5,0,7);fx.fill();}
}
render(0);
</script></body></html>
