<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/fonts.css"><link rel="stylesheet" href="../kit/kit.css">
<style>
.yr{position:absolute;font:700 58px/1 'Barlow Condensed';color:var(--brassHi);text-align:center;}
.rl{position:absolute;font:600 34px/1.1 'Barlow Condensed';letter-spacing:.03em;color:var(--ink);text-align:center;}
.gun{position:absolute;width:420px;height:84px;margin:-42px 0 0 -210px;}
.gun svg{width:420px;height:84px;}
#svg{position:absolute;left:0;top:0;} #fx{position:absolute;inset:0;pointer-events:none;}
</style></head><body>
<div id="frame"><div id="stage">
 <svg id="svg" width="1920" height="1080"></svg>
 <div class="t title" id="ti" style="left:960px;top:84px;font-size:88px"><span class="mask"><span>Forty Years, Three Jobs</span></span></div>
 <div id="labs"></div>
 <div class="gun" id="g0"></div><div class="gun" id="g1"></div><div class="t lab" id="x3" style="color:var(--odHi);font-size:44px">×3</div><div class="gun" id="gh0"></div><div class="gun" id="gh1"></div><div class="gun" id="gh2"></div>
 <canvas id="fx" width="1920" height="1080"></canvas>
</div><div id="vig"></div></div>
<script src="../kit/kit.js"></script><script src="../kit/bar_svg.js"></script>
<script>
const CUE={age:2.4,m14:7.8,m60:12.1,n57:9.9,p57:9.9,rew:15.4,n18:16.8,m38:17.7,n38:19.2,m44:20.4,n44:22.0,m57:23.4,end:24.6};
const X=y=>220+(y-1915)*(1480/45), AY=690, LANE=452;
const N=[{y:1918,role:'Walking gun',up:1,t:CUE.n18},{y:1938,role:'Squad machine gun (M1918A2)',up:0,t:CUE.n38},
 {y:1944,role:'Heart of the Marine fire team',up:1,t:CUE.n44},{y:1957,role:'Replaced: M14 automatic and M60',up:0,t:CUE.n57,rust:1}];
const svg=$('svg');
svg.innerHTML=`<line id="ax" x1="${X(1915)}" y1="${AY}" x2="${X(1960)}" y2="${AY}" stroke="#8f897a" stroke-width="3"/>
${[1920,1930,1940,1950,1960].map(y=>`<g class="dt"><line x1="${X(y)}" y1="${AY-8}" x2="${X(y)}" y2="${AY+8}" stroke="#8f897a" stroke-width="2"/><text x="${X(y)}" y="${AY+40}" fill="#6f6a5e" font-family="IBM Plex Mono" font-size="20" text-anchor="middle">${y}</text></g>`).join('')}
<line id="age" x1="${X(1918)}" y1="${AY}" x2="${X(1951)}" y2="${AY}" stroke="#b5ac94" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/><line id="prog" x1="${X(1918)}" y1="${AY}" x2="${X(1918)}" y2="${AY}" stroke="#e8c983" stroke-width="7" stroke-linecap="round"/>
${N.map((n,i)=>`<g class="nd" id="nd${i}"><line x1="${X(n.y)}" y1="${AY}" x2="${X(n.y)}" y2="${n.up?AY-70:AY+70}" stroke="${n.rust?'#b3362a':'#c9a45a'}" stroke-width="2"/>
<circle cx="${X(n.y)}" cy="${AY}" r="13" fill="#1b1914" stroke="${n.rust?'#d9573f':'#e8c983'}" stroke-width="4"/></g>`).join('')}`;
const L=$('labs');
N.forEach((n,i)=>{const y=document.createElement('div');y.className='yr t';y.textContent=n.y;if(n.rust)y.style.color='#d9573f';
 const r=document.createElement('div');r.className='rl t';if(n.rust){r.innerHTML='<span>Replaced: M14 automatic</span><span> and M60</span>';}else r.textContent=n.role;
 const top=n.up?AY-170:AY+86; y.style.top=top+'px'; r.style.top=(top+64)+'px';
 const cx=Math.min(X(n.y),1740-0); [y,r].forEach(e=>{e.style.left=cx+'px';});
 L.appendChild(y);L.appendChild(r);n.Y=y;n.R=r;});
$('g0').innerHTML=barSVG({bipod:false,color:'#ece5d3',wood:'#7a5d3c'});
$('g1').innerHTML=barSVG({bipod:true,color:'#ece5d3',wood:'#7a5d3c'});
$('gh0').innerHTML=barSVG({bipod:true,color:'#a3ad86',wood:'#a3ad86'});$('gh1').innerHTML=barSVG({bipod:true,color:'#a3ad86',wood:'#a3ad86'}); $('gh2').innerHTML=barSVG({bipod:true,color:'#a3ad86',wood:'#a3ad86'});
// gun travel along the timeline, as a function of time
function yr(t){
 if(t<CUE.rew) return 1951;
 if(t<CUE.n18) return lerp(1951,1918,inOutCubic(seg(t,CUE.rew,CUE.n18-0.1)));
 if(t<CUE.m38) return 1918; if(t<CUE.n38) return lerp(1918,1938,inOutCubic(seg(t,CUE.m38,CUE.n38)));
 if(t<CUE.m44) return 1938; if(t<CUE.n44) return lerp(1938,1944,inOutCubic(seg(t,CUE.m44,CUE.n44)));
 if(t<CUE.m57) return 1944; return lerp(1944,1957,inOutCubic(seg(t,CUE.m57,CUE.end)));}
let reach=1918;
const fx=$('fx').getContext('2d');
function render(t){
 const a=ambient(t); const Y=yr(t);
 const trk=t<CUE.rew?0:(X(1937)-X(Y))*0.06*inOutSine(seg(t,CUE.rew,CUE.rew+1.5));
 $('stage').style.transform=`translate(${a.x+trk}px,${a.y}px) scale(${lerp(1.02,1,inOutSine(seg(t,0,10)))})`;
 const ti=$('ti'); maskIn(ti.firstChild.firstChild,outQuint(seg(t,-0.9,0.5))); ti.style.transform='translateX(-50%)';
 $('ax').style.opacity=0.45+0.55*outCubic(seg(t,0,1.5));
 document.querySelectorAll('.dt').forEach((g,i)=>g.style.opacity=0.6+0.4*outCubic(seg(t,0.2+i*0.12,0.8+i*0.12)));
 // nodes and labels
 N.forEach((n,i)=>{const p=outBack(seg(t,n.t,n.t+0.6),1.6); const nd=$('nd'+i);
  nd.style.opacity=cl(p*2); nd.style.transformOrigin=`${X(n.y)}px ${AY}px`; nd.style.transform=`scale(${0.6+0.4*p})`;
  const ly=outCubic(seg(t,n.t+0.15,n.t+0.8)), lr=outCubic(seg(t,n.t+0.4,n.t+1.1));
  const align=n.y===1957?'translateX(-72%)':'translateX(-50%)';
  n.Y.style.opacity=ly; n.Y.style.transform=`${align} translateY(${(1-ly)*(n.up?16:-16)}px)`;
  n.R.style.opacity=n.rust?1:lr; if(n.rust){const a1=outCubic(seg(t,CUE.m14,CUE.m14+0.6)),a2=outCubic(seg(t,CUE.m60,CUE.m60+0.6));n.R.children[0].style.opacity=a1;n.R.children[1].style.opacity=a2;} n.R.style.transform=`${align} translateY(${(1-lr)*(n.up?12:-12)}px)`;});
 // 1957 pulse when the year is spoken
 const pp=seg(t,CUE.p57,CUE.p57+1.2);
 // progress line: brass trail of how far the story has reached
 if(t>=CUE.n18) reach=Math.max(1918,Y); else reach=1918;
 const ag=$('age'); const apg=inOutCubic(seg(t,CUE.age,CUE.age+1.4)); ag.setAttribute('x1',lerp(X(1951),X(1918),apg)); ag.style.opacity=(t<CUE.age?0:0.8)*(1-outCubic(seg(t,CUE.rew,CUE.rew+0.8)));
 const x3=$('x3'); const xp=outCubic(seg(t,CUE.n44+0.7,CUE.n44+1.3)); x3.style.opacity=xp; x3.style.left=(X(1944)-250)+'px'; x3.style.top=(LANE-130)+'px';
 const pr=$('prog'); pr.setAttribute('x2',X(reach)); pr.style.opacity=t<CUE.n18?0:outCubic(seg(t,CUE.n18,CUE.n18+0.4));
 // the gun: shown aging in the 1950s, rewinds to 1918, then travels
 const gx=X(Y), bob=Math.sin(t*1.1)*3;
 const show=outCubic(seg(t,0.6,1.6)); const bip=outCubic(seg(t,CUE.n38,CUE.n38+0.6));
 const grey=t<CUE.rew?0.55:(t>CUE.end-0.4?lerp(1,0.45,seg(t,CUE.end-0.4,CUE.end+0.6)):1);
 const g0=$('g0'),g1=$('g1');
 const preBip=t<CUE.rew?1:0; // 1950s view shows the A2 with bipod
 const wB=t<CUE.rew?1:(t<CUE.n18?1-seg(t,CUE.rew,CUE.rew+1.0):bip);
 g0.style.opacity=show*grey*(1-wB); g1.style.opacity=show*grey*wB;
 const tilt=(t>CUE.rew&&t<CUE.n18)?-2*Math.sin(Math.PI*seg(t,CUE.rew,CUE.n18)):0;
 [g0,g1].forEach(g=>{g.style.left=gx+'px'; g.style.top=(LANE+bob)+'px'; g.style.transform=`rotate(${tilt}deg)`; g.style.filter=t>CUE.end-0.4||t<CUE.rew?`saturate(${grey})`:'none';});
 // three per squad: two ghost copies fan out at 1944 and stay there
 const gp=inOutCubic(seg(t,CUE.n44,CUE.n44+0.9));
 [['gh0',0],['gh1',-1],['gh2',-2]].forEach(([id,s])=>{const e=$(id); e.style.left=X(1944)+'px'; e.style.top=(LANE+s*gp*94+bob)+'px';
  e.style.opacity=(t<CUE.n44?0:(id==='gh0'?0.5*seg(t,CUE.m57,CUE.m57+0.6):0.5*gp))*(t>CUE.m57?lerp(1,0.7,seg(t,CUE.m57,CUE.end)):1); e.style.transform=`scale(${0.9})`;});
 fx.clearRect(0,0,1920,1080);
 if(pp>0&&pp<1){fx.strokeStyle=`rgba(217,87,63,${0.5*(1-pp)})`;fx.lineWidth=3;fx.beginPath();fx.arc(X(1957),AY,lerp(14,70,outCubic(pp)),0,7);fx.stroke();}
 // soft glow at the leading end of the progress line
 if(t>CUE.n18){const x=X(reach);const g=fx.createRadialGradient(x,AY,0,x,AY,60);g.addColorStop(0,`rgba(232,201,131,${0.25+0.05*Math.sin(t*2)})`);g.addColorStop(1,'rgba(232,201,131,0)');fx.fillStyle=g;fx.fillRect(x-60,AY-60,120,120);}
 for(let i=0;i<24;i++){const px=(hn(i)*1920+t*(6+hn(i+40)*8))%1920, py=(hn(i+90)*1080-t*(4+hn(i+7)*4)+1080)%1080;
  fx.fillStyle=`rgba(236,229,211,${0.04+0.05*hn(i+3)})`;fx.beginPath();fx.arc(px,py,1.1+hn(i+5)*1.5,0,7);fx.fill();}
}
render(0);
</script></body></html>
