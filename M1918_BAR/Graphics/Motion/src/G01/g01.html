<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/fonts.css"><link rel="stylesheet" href="../kit/kit.css">
<style>
#axis{position:absolute;left:0;top:0;}
.rnd{position:absolute;width:19px;height:68px;margin:-34px 0 0 -9.5px;border-radius:7px 7px 2px 2px;
 background:linear-gradient(180deg,#d9b46a 0%,#b9893c 26%,#c9a45a 27%,#e8c983 55%,#9c7432 100%);
 box-shadow:0 0 14px rgba(232,201,131,.25);}
.rnd::before{content:'';position:absolute;left:2px;right:2px;top:0;height:16px;border-radius:7px 7px 1px 1px;background:linear-gradient(180deg,#a87447,#7a4f2c);}
.rl{position:absolute;width:19px;height:68px;margin:-34px 0 0 -9.5px;border-radius:7px 7px 2px 2px;
 background:linear-gradient(180deg,#a3ad86,#6f7a57);box-shadow:0 0 12px rgba(163,173,134,.2);}
.rl::before{content:'';position:absolute;left:2px;right:2px;top:0;height:16px;border-radius:7px 7px 1px 1px;background:#4f573d;}
#ph{position:absolute;top:330px;width:2px;height:560px;margin-left:-1px;background:linear-gradient(180deg,rgba(232,201,131,0),rgba(232,201,131,.9) 30%,rgba(232,201,131,.9) 70%,rgba(232,201,131,0));box-shadow:0 0 18px rgba(232,201,131,.6);}
#stamp{position:absolute;font:700 88px/1 'Barlow Condensed';color:var(--brassHi);letter-spacing:.01em;text-shadow:0 0 30px rgba(232,201,131,.35);}
#br{position:absolute;height:22px;border:3px solid var(--brass);border-bottom:none;}
#cnt{position:absolute;font:700 64px/1 'Barlow Condensed';color:var(--ink);text-align:center;width:120px;font-variant-numeric:tabular-nums;}
#sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
</style></head><body>
<div id="frame"><div id="stage">
 <svg id="axis" width="1920" height="1080"></svg>
 <div class="t kick" id="k" style="left:160px;top:96px">Rate of fire · M1918A2</div>
 <div class="t title" id="ti" style="left:156px;top:140px"><span class="mask"><span>Twenty Rounds, Two Seconds</span></span></div>
 <div class="t expl" id="ex" style="left:160px;top:252px">At full rate, the whole magazine is gone almost at once</div>
 <div class="t lab" id="l1" style="left:160px;top:566px;color:var(--brassHi)">550 rounds/min</div>
 <div class="t foot" id="l1b" style="left:160px;top:614px">20-round magazine</div>
 <div class="t lab" id="l2" style="left:160px;top:770px;color:var(--odHi)">Most effective:</div>
 <div class="t lab" id="l2b" style="left:160px;top:816px;color:var(--odHi)">120–150 rounds/min</div>
 <div id="rounds"></div><div id="cnt"></div>
 <div id="br"></div><div id="stamp">≈2.2 s</div>
 <div id="ph"></div>
 <div class="t foot" id="ft" style="left:160px;top:990px">Rates from FM 23-15 (1943)</div>
 <canvas id="sweep" width="1920" height="1080"></canvas>
</div><div id="vig"></div></div>
<script src="../kit/kit.js"></script>
<script>
// cue times (s) relative to graphic start; set from narration word timestamps
const CUE=Object.assign({title:0.0,expl:1.0,rate:2.6,burst:5.3,stamp:7.5,low:8.5,end:16.1},window.CUE_OVERRIDE||{});
const X0=660,PX=370,Y1=560,Y2=800; // axis 0 s at X0, PX px per second
const xs=s=>X0+s*PX, TEMPTY=20/550*60;
const MAGX=470,MAGY=Y1-6;
const svg=$('axis');
svg.innerHTML=`
<defs><linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="${xs(0)}" x2="${xs(3.1)}" y1="0" y2="0"><stop offset="0" stop-color="#8f897a" stop-opacity=".2"/><stop offset=".15" stop-color="#8f897a"/><stop offset="1" stop-color="#8f897a"/></linearGradient></defs>
<g id="ax"><line id="axl" x1="${xs(0)}" y1="680" x2="${xs(3.1)}" y2="680" stroke="url(#ag)" stroke-width="3"/>
${[0,1,2,3].map(s=>`<g class="tk" data-s="${s}"><line x1="${xs(s)}" y1="668" x2="${xs(s)}" y2="692" stroke="#8f897a" stroke-width="3"/>
<text x="${xs(s)}" y="728" fill="#8f897a" font-family="IBM Plex Mono" font-size="24" text-anchor="middle">${s} s</text></g>`).join('')}
${Array.from({length:30},(_,i)=>i/10).filter(s=>s%1).map(s=>`<line class="mt" x1="${xs(s)}" y1="676" x2="${xs(s)}" y2="684" stroke="#4a463d" stroke-width="2"/>`).join('')}
</g>
<line id="lim" x1="${xs(TEMPTY)}" y1="470" x2="${xs(TEMPTY)}" y2="870" stroke="#c9a45a" stroke-width="2" stroke-dasharray="6 9"/>
<g id="mag" transform="translate(${MAGX},${MAGY})">
 <path d="M-46 -120 L46 -120 L46 118 Q46 132 32 132 L-32 132 Q-46 132 -46 118 Z" fill="rgba(236,229,211,.04)" stroke="#ece5d3" stroke-width="3"/>
 <path d="M-30 -120 L-22 -136 L22 -136 L30 -120" fill="none" stroke="#ece5d3" stroke-width="3"/>
 <line x1="-46" y1="96" x2="46" y2="96" stroke="#ece5d3" stroke-width="2" opacity=".5"/>
 <rect id="fill" x="-38" y="-112" width="76" height="200" fill="#c9a45a" opacity=".22"/>
</g>`;
// top row: 20 cartridges, fired in real time at 550 rpm
const R=$('rounds'),tops=[],lows=[];
for(let k=0;k<20;k++){const d=document.createElement('div');d.className='rnd';R.appendChild(d);tops.push(d);}
const LOWT=[0,0.5,1.0,1.5,2.0]; // 120 rpm = one round every 0.5 s
for(const s of LOWT){const d=document.createElement('div');d.className='rl';R.appendChild(d);lows.push(d);}
const sw=$('sweep').getContext('2d');
function render(t){
 const a=ambient(t);
 // camera: slow push-out, gentle truck that follows the burst, then settles
 const push=lerp(1.035,1.0,inOutSine(seg(t,0,9)));
 const trk=Math.sin(Math.PI*seg(t,CUE.burst-0.3,CUE.burst+3.2))*-14*inOutSine(seg(t,CUE.burst-0.3,CUE.burst+1.2));
 $('stage').style.transform=`translate(${a.x+trk}px,${a.y}px) scale(${push})`;
 // titles
 maskIn($('ti').firstChild.firstChild,outQuint(seg(t,CUE.title-0.9,CUE.title+0.5)));
 reveal($('k'),outCubic(seg(t,CUE.title-0.6,CUE.title+0.6)),0,-20);
 reveal($('ex'),outCubic(seg(t,CUE.expl,CUE.expl+0.9)),16);
 // axis draws on (present faintly in frame one)
 const ap=lerp(0.4,1,inOutCubic(seg(t,0,CUE.rate+0.4)));
 const axl=$('axl'); axl.setAttribute('x2',lerp(xs(0),xs(3.1),ap)); axl.style.opacity=0.35+0.65*ap;
 document.querySelectorAll('.tk').forEach(g=>{const s=+g.dataset.s;g.style.opacity=outCubic(seg(t,-0.4+s*0.3,0.4+s*0.3));});
 document.querySelectorAll('.mt').forEach(l=>l.style.opacity=0.8*ap);
 // magazine + rate label
 const mp=0.55+0.45*outCubic(seg(t,CUE.rate-0.4,CUE.rate+0.6));
 $('mag').style.opacity=mp; $('mag').setAttribute('transform',`translate(${MAGX},${MAGY+(1-mp)*24})`);
 reveal($('l1'),outCubic(seg(t,CUE.rate,CUE.rate+0.7)),0,-24);
 reveal($('l1b'),outCubic(seg(t,CUE.rate+0.35,CUE.rate+1.0)),0,-24);
 // burst: playhead sweeps 0..TEMPTY in real time; each round leaves the magazine and lands on its tick
 const tb=t-CUE.burst; const fired=tops.reduce((n,_,k)=>n+(tb>=k*60/550?1:0),0);
 tops.forEach((d,k)=>{const tf=k*60/550; const u=seg(tb,tf,tf+0.42); const e=outCubic(u);
  const x1=xs(tf+0.05), y1=Y1; const x=lerp(MAGX,x1,e), y=lerp(MAGY-120,y1,e)-Math.sin(Math.PI*u)*70;
  const rot=(1-outBack(u,1.2))*-38; const land=seg(tb,tf+0.36,tf+0.6);
  const glow=Math.exp(-((tb-tf-0.4)**2)/0.02);
  d.style.opacity=tb<tf?0:Math.min(1,u*4);
  d.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${1+0.08*Math.sin(Math.PI*land)})`;
  d.style.filter=`brightness(${1+0.5*glow+0.05*Math.sin(t*1.3+k)})`;});
 $('fill').setAttribute('height',200*(1-fired/20)); $('fill').setAttribute('y',-112+200*fired/20);
 const cn=$('cnt'); cn.textContent=String(20-fired); cn.style.left=(MAGX-60)+'px'; cn.style.top=(MAGY-36)+'px';
 cn.style.opacity=mp*(tb<0?0.9:1); cn.style.color=fired>=20?'#d9573f':'#ece5d3';
 const ph=$('ph'); const pp=seg(tb,0,TEMPTY); ph.style.left=xs(pp*TEMPTY)+'px';
 ph.style.opacity=tb<0?0:(tb<TEMPTY+0.15?1:1-outCubic(seg(tb,TEMPTY+0.15,TEMPTY+0.9)));
 // limit line + bracket + stamp
 const lp=outCubic(seg(t,CUE.stamp-0.6,CUE.stamp+0.2)); $('lim').style.opacity=0.8*lp;
 const bw=xs(TEMPTY)-xs(0)+12; const br=$('br'); br.style.left=(xs(0)-6)+'px'; br.style.top='470px';
 br.style.width=(bw*inOutCubic(seg(t,CUE.stamp-0.5,CUE.stamp+0.3)))+'px'; br.style.opacity=lp;
 const sp=seg(t,CUE.stamp,CUE.stamp+0.45); const st=$('stamp');
 st.style.left=(xs(TEMPTY)+36)+'px'; st.style.top='508px';
 st.style.opacity=outCubic(sp); st.style.transform=`scale(${lerp(1.35,1,outBack(sp,1.6))})`;
 // lower row: 5 rounds in the same window, placed one by one
 reveal($('l2'),outCubic(seg(t,CUE.low,CUE.low+0.7)),0,-24);
 reveal($('l2b'),outCubic(seg(t,CUE.low+0.3,CUE.low+1.0)),0,-24);
 lows.forEach((d,j)=>{const u=outBack(seg(t,CUE.low+0.4+j*0.42,CUE.low+0.95+j*0.42),1.3);
  d.style.opacity=cl(u*3); d.style.transform=`translate(${xs(LOWT[j]+0.05)}px,${Y2+(1-u)*-40}px)`;
  d.style.filter=`brightness(${1+0.05*Math.sin(t*1.1+j*2)})`;});
 reveal($('ft'),outCubic(seg(t,CUE.low+2.0,CUE.low+2.8)),0);
 // light sweep across the brass row after it lands (once), then a faint breathing sheen
 sw.clearRect(0,0,1920,1080); const sv=seg(t,CUE.stamp+0.6,CUE.stamp+2.0);
 if(sv>0&&sv<1){const cx=lerp(xs(-0.3),xs(2.6),inOutSine(sv)); const g=sw.createLinearGradient(cx-120,0,cx+120,0);
  g.addColorStop(0,'rgba(255,230,170,0)');g.addColorStop(.5,'rgba(255,230,170,.16)');g.addColorStop(1,'rgba(255,230,170,0)');
  sw.fillStyle=g; sw.fillRect(cx-120,500,240,130);}
 // dust motes in archive light
 for(let i=0;i<26;i++){const px=(hn(i)*1920+t*(8+hn(i+40)*10))%1920, py=(hn(i+90)*1080-t*(4+hn(i+7)*5)+1080)%1080;
  sw.fillStyle=`rgba(236,229,211,${0.05+0.06*hn(i+3)})`; sw.beginPath(); sw.arc(px,py,1.2+hn(i+5)*1.6,0,7); sw.fill();}
}
render(0);
</script></body></html>
