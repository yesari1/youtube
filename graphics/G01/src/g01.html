<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --ink:#ece5d3; --dim:#8f897a; --built:#7f8b66; --builtHi:#a3ad86; --ussr:#b3362a; --ussrHi:#d9573f; --bg0:#0d0c0a; --bg1:#1c1a15; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg0); }
  #frame { position:absolute; inset:0; overflow:hidden;
    background: radial-gradient(120% 95% at 42% 45%, #221f19 0%, var(--bg1) 38%, #100f0c 78%, #080807 100%); }
  #grid { position:absolute; inset:-80px; opacity:.07;
    background-image: linear-gradient(#cfc6ad 1px, transparent 1px), linear-gradient(90deg, #cfc6ad 1px, transparent 1px);
    background-size: 60px 60px; }
  #stage { position:absolute; inset:0; transform-origin: 44% 52%; }
  .t { position:absolute; white-space:nowrap; color:var(--ink); }
  #kicker { left:300px; top:184px; font:500 26px 'IBM Plex Mono'; letter-spacing:.14em; color:var(--dim); }
  #kline { position:absolute; left:300px; top:226px; height:3px; background:var(--ussr); width:0; }
  .word { display:inline-block; overflow:hidden; vertical-align:bottom; padding:0 .04em .12em; margin-bottom:-.12em; }
  .word > span { display:inline-block; }
  #title { left:290px; top:238px; font:900 164px/1 'Playfair Display'; letter-spacing:-.01em; }
  #uline { position:absolute; height:10px; background:var(--ussr); top:0; left:0; width:0; }
  .lab { font:600 44px/1 'Barlow Condensed'; letter-spacing:.03em; color:var(--ink); }
  .bar { position:absolute; left:300px; height:124px; width:0; overflow:hidden; }
  .bar .fill { position:absolute; inset:0; }
  .bar .edge { position:absolute; top:0; bottom:0; right:-2px; width:160px; opacity:0; }
  #bBuilt { top:505px; }
  #bBuilt .fill { background: linear-gradient(180deg, #8d9973 0%, var(--built) 55%, #6a7555 100%); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  #bBuilt .edge { background: linear-gradient(90deg, rgba(220,230,190,0) 0%, rgba(230,236,205,.55) 88%, rgba(255,255,240,.95) 100%); }
  #bUssr { top:715px; }
  #bUssr .fill { background: linear-gradient(180deg, #c4412f 0%, var(--ussr) 55%, #8f2a20 100%); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  #bUssr .edge { background: linear-gradient(90deg, rgba(255,120,90,0) 0%, rgba(255,150,110,.5) 88%, rgba(255,230,210,.95) 100%); }
  .sheen { position:absolute; top:0; bottom:0; width:260px; left:-300px; background:linear-gradient(100deg, rgba(255,255,240,0) 0%, rgba(255,255,240,.28) 50%, rgba(255,255,240,0) 100%); mix-blend-mode:screen; }
  .hl { position:absolute; left:0; right:0; top:0; height:3px; background:rgba(255,255,235,.22); }
  .scan { position:absolute; inset:0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 2px, rgba(0,0,0,0) 2px 5px); mix-blend-mode:multiply; }
  #lBuilt { top:448px; left:300px; }
  #lUssr  { top:658px; left:300px; }
  #vBuilt { top:567px; overflow:hidden; font:700 76px/1 'Barlow Condensed'; color:#16150f; transform:translateY(-50%); font-variant-numeric: tabular-nums; }
  #axis { position:absolute; left:298px; top:440px; width:3px; height:0; background:#6d685c; }
  #half { position:absolute; top:490px; width:0; height:0; border-left:3px dashed rgba(236,229,211,.75); }
  #band { position:absolute; top:705px; height:144px; opacity:0; overflow:hidden;
    background: repeating-linear-gradient(135deg, rgba(236,229,211,.34) 0 10px, rgba(236,229,211,.08) 10px 22px);
    outline: 3px solid rgba(236,229,211,.95); outline-offset:-3px; }
  #brk { position:absolute; top:866px; height:22px; border:4px solid var(--ink); border-top:none; opacity:0; }
  #vUssr { top:777px; font:700 76px/1 'Barlow Condensed'; transform:translateY(-50%); font-variant-numeric: tabular-nums; }
  #foot { left:300px; top:958px; font:400 22px 'IBM Plex Mono'; letter-spacing:.04em; color:#7c776a; }
</style></head>
<body>
<div id="frame">
  <div id="grid"></div>
  <div id="stage">
    <div id="kicker" class="t">P-39 Airacobra, 1940–45</div>
    <div id="kline"></div>
    <div id="title" class="t"><span class="word"><span id="w1">Nearly</span></span> <span class="word" id="hw"><span id="w2">half</span></span><div id="uline"></div></div>
    <div id="axis"></div>
    <div id="lBuilt" class="t lab">Built</div>
    <div id="bBuilt" class="bar"><div class="fill"></div><div class="scan"></div><div class="hl"></div><div class="sheen"></div><div class="edge"></div></div>
    <div id="vBuilt" class="t"></div>
    <div id="lUssr" class="t lab">To the USSR</div>
    <div id="bUssr" class="bar"><div class="fill"></div><div class="scan"></div><div class="hl"></div><div class="sheen"></div><div class="edge"></div></div>
    <div id="half"></div>
    <div id="band"></div>
    <div id="brk"></div>
    <div id="vUssr" class="t">c. 4,400–4,950</div>
    <div id="foot" class="t">Sources: AAF Statistical Digest; AAF official history; Soviet/Western estimates</div>
  </div>
</div>
<script>
const X0 = 300, X1 = 1680;                       // shared zero-based scale: 0 .. 10,000
const sx = v => X0 + (X1 - X0) * v / 10000;
const cl = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const outQuint = x => 1 - Math.pow(1 - x, 5);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');

function reveal(el, p, dy = 40) {                 // fade + rise
  el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`;
}

window.render = function (t) {
  // camera: slow push-in and drift, micro gate weave
  const cam = inOutCubic(t / 6);
  const wx = Math.sin(t * 7.3) * 0.7 + Math.sin(t * 13.1) * 0.4, wy = Math.cos(t * 6.1) * 0.6;
  $('stage').style.transform = `translate(${wx - cam * 14}px, ${wy - cam * 6}px) scale(${1.0 + cam * 0.045})`;
  $('grid').style.transform = `translate(${-t * 6}px, ${-t * 2.5}px)`;

  // kicker + rule
  reveal($('kicker'), outCubic(seg(t, 0.0, 0.5)), 14);
  $('kline').style.width = (outExpo(seg(t, 0.1, 0.9)) * 120) + 'px';

  // title words rise out of a mask
  const w1 = outQuint(seg(t, 0.05, 0.75)), w2 = outQuint(seg(t, 0.22, 0.92));
  $('w1').style.transform = `translateY(${(1 - w1) * 110}%)`;
  $('w2').style.transform = `translateY(${(1 - w2) * 110}%)`;
  // underline under "half" once the answer is on screen
  const hw = $('hw'), u = outExpo(seg(t, 4.75, 5.35));
  const ul = $('uline');
  ul.style.left = (hw.offsetLeft + 6) + 'px'; ul.style.top = (hw.offsetTop + hw.offsetHeight - 14) + 'px';
  ul.style.width = (u * (hw.offsetWidth - 14)) + 'px';

  // axis draws down
  $('axis').style.height = (outCubic(seg(t, 0.0, 0.7)) * 440) + 'px';

  // BUILT: 0.25-1.9 s growth, label with it
  reveal($('lBuilt'), outCubic(seg(t, 0.15, 0.55)), 18);
  const pb = outQuint(seg(t, 0.25, 1.95));
  const bw = (sx(9588) - X0) * pb;
  $('bBuilt').style.width = bw + 'px';
  $('bBuilt').querySelector('.edge').style.opacity = pb > 0 && pb < 1 ? (1 - Math.pow(pb, 6)) : 0;
  // counter rides the leading edge, then settles and the range completes
  const vb = $('vBuilt');
  const cnt = outQuint(seg(t, 0.35, 1.45));
  vb.innerHTML = fmt(9558 * cnt) + '<span id="vtail" style="display:inline-block;overflow:hidden;vertical-align:top"><span>–9,588</span></span>';
  const tail = outCubic(seg(t, 1.75, 2.15));
  const vt = $('vtail'); vt.style.width = (tail * vt.firstChild.offsetWidth) + 'px';
  vb.style.opacity = cl((bw - 260) / 120);
  const numW = vb.offsetWidth - vt.offsetWidth;
  const ride = X0 + bw - numW - 34, rest = X0 + 34;
  const settle = inOutCubic(seg(t, 1.3, 1.8));
  vb.style.left = (ride + (rest - ride) * settle) + 'px';
  // sheen sweeps each bar as it lands
  const shB = seg(t, 1.6, 2.3), shU = seg(t, 3.5, 4.2);
  $('bBuilt').querySelector('.sheen').style.left = (-300 + shB * (bw + 600)) + 'px';
  $('bUssr').querySelector('.sheen').style.left = (-300 + shU * ((sx(4700) - X0) + 600)) + 'px';

  // USSR: 2.0-4.0 s growth to 4,700 (solid), label with it
  reveal($('lUssr'), outCubic(seg(t, 1.9, 2.3)), 18);
  const pu = outQuint(seg(t, 2.05, 3.95));
  $('bUssr').style.width = ((sx(4700) - X0) * pu) + 'px';
  $('bUssr').querySelector('.edge').style.opacity = pu > 0 && pu < 1 ? (1 - Math.pow(pu, 6)) : 0;

  // half-way guide drops from the middle of the Built bar
  const hg = outCubic(seg(t, 3.2, 3.9));
  const half = $('half');
  half.style.left = (sx(9588 / 2) - 1) + 'px';
  half.style.height = (hg * 400) + 'px';
  half.style.opacity = hg > 0 ? 0.55 + 0.45 * hg : 0;

  // uncertainty range opens outward from 4,700 to 4,400 / 4,950
  const r = outExpo(seg(t, 4.0, 4.75));
  const a = 4700 - (4700 - 4400) * r, b = 4700 + (4950 - 4700) * r;
  const band = $('band');
  band.style.left = sx(a) + 'px'; band.style.width = Math.max(0, sx(b) - sx(a)) + 'px';
  band.style.opacity = r > 0 ? cl(r * 3) : 0;
  band.style.backgroundPosition = `${t * 40}px 0`;
  const brk = $('brk');
  brk.style.left = (sx(a) - 2) + 'px'; brk.style.width = Math.max(0, sx(b) - sx(a) - 4) + 'px';
  brk.style.opacity = r > 0 ? cl(r * 3) : 0;
  const lv = outQuint(seg(t, 4.3, 5.0));
  const vu = $('vUssr');
  vu.style.left = (sx(4950) + 44 - (1 - lv) * 40) + 'px'; vu.style.opacity = lv;

  // sources footer
  reveal($('foot'), outCubic(seg(t, 0.5, 1.2)), 8);
};
render(0);
</script>
</body></html>
